name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Configure git identity for worktree/commit tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Build
        run: go build ./...

      - name: Quality gate
        env:
          PUSHGUARD_NO_AUTOSPAWN: "1"
          PUSHGUARD_REDIS_ADDR: ""
        run: make check
